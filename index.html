<body id="main_page_bg"

    <div class="bento_background">

                <div id="song_player"></div>
                <div class="info_container">

                    <div class="song_name" id="title">
                        Title
                    </div>
                    <div class="artist_name" id="artist">
                        UnknownArtist
                    </div>
                </div>

                <div class="buttons">
                    <div class="previous_button">
                        <button class="previous_button" id="previous_button">

                            style="border-radius: 100%;">
                    </a>
                </div>
                <div class="date_clock_container">
                    <div class="day_name" id="day">Weekday</div>
                    <div class="calendar" id="calendar">
                        00 Month 0000
                    </div>
                    <div class="clock" id="clock">
                        00:00:00
                    </div>
                </div>
            </div>

            <div class="bento_item utils">
                <div class="utils_grid">
                    <div class="utils_item" id="games">
                        <i data-lucide="gamepad-2"></i>
                    </div>
                    <div class="utils_item" name="under_construction1">

                    </div>
                    <div class="utils_item" name="under_construction2">

                    </div>
                    <div class="utils_item" name="under_construction3">
